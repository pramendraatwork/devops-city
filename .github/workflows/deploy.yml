name: 🏙️ Deploy DevOps City to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: 🚀 Build & Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Verify Files
        run: |
          echo "📁 Files in repository:"
          ls -la
          echo ""
          if [ -f "index.html" ]; then
            echo "✅ index.html found! Ready to deploy."
            echo "📦 File size: $(du -sh index.html | cut -f1)"
          else
            echo "❌ index.html NOT found! Deployment will fail."
            exit 1
          fi

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🌍 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🎉 Deployment Success
        run: |
          echo ""
          echo "🏙️ ======================================"
          echo "   DevOps City is LIVE!"
          echo "   ${{ steps.deployment.outputs.page_url }}"
          echo "🏙️ ======================================"
          echo ""